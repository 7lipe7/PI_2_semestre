<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Banner de Felipe Santana — Desenvolvedor Full Stack">
  <title>Felipe Santana — Desenvolvedor</title>

  <defs>
    <!-- Gradiente com brilho em movimento para o nome -->
    <linearGradient id="shine" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-900 0; 900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Gradiente da borda -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="0.5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>

    <!-- Gradiente da barra de progresso -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="0.5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>

    <!-- Mascara do efeito de digitacao -->
    <mask id="typing">
      <rect x="148" y="138" width="0" height="42" fill="#fff">
        <animate attributeName="width" values="0;610" begin="0.6s" dur="3.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
      </rect>
    </mask>

    <!-- Desfoque dos blobs de luz -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <!-- Grade sutil de fundo -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="300" rx="16" fill="#0d1117"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>

  <!-- Blobs de luz animados -->
  <circle cx="180" cy="70" r="130" fill="#7c3aed" opacity="0.22" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 130 45; 0 0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="240" r="140" fill="#1d4ed8" opacity="0.22" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -120 -50; 0 0" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Borda com tracos em movimento -->
  <rect x="1.5" y="1.5" width="897" height="297" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Selo Open to Work com pulso -->
  <g>
    <rect x="24" y="20" width="140" height="26" rx="13" fill="#12261e" stroke="#238636" stroke-width="1"/>
    <circle cx="42" cy="33" r="5" fill="#3fb950"/>
    <circle cx="42" cy="33" r="5" fill="none" stroke="#3fb950" stroke-width="2">
      <animate attributeName="r" values="5;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="37" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#3fb950" font-weight="bold">Open to Work</text>
  </g>

  <!-- Tag de codigo no topo -->
  <text x="450" y="47" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">
    &lt;/&gt; desenvolvedor_fullstack.ts
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Nome com gradiente animado -->
  <text x="450" y="112" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="bold" fill="url(#shine)">
    &lt;Felipe Santana /&gt;
  </text>

  <!-- Linha digitada + cursor -->
  <g mask="url(#typing)">
    <text x="148" y="167" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#e6edf3">
      &gt; Estudante de Desenvolvimento de Software Multiplataforma
    </text>
  </g>
  <rect x="150" y="152" width="10" height="20" fill="#3fb950" opacity="0">
    <animate attributeName="x" values="150;758" begin="0.6s" dur="3.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="1;0" begin="3.8s" dur="0.7s" repeatCount="indefinite"/>
  </rect>

  <!-- Chips de tecnologias (aparecem em sequencia) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold">
    <g opacity="0">
      <rect x="161" y="212" width="50" height="28" rx="14" fill="#121d2f" stroke="#4f46e5" stroke-width="1"/>
      <text x="186" y="231" text-anchor="middle" fill="#a5b4fc">PHP</text>
      <animate attributeName="opacity" values="0;1" begin="4s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="221" y="212" width="92" height="28" rx="14" fill="#2a230c" stroke="#e3b341" stroke-width="1"/>
      <text x="267" y="231" text-anchor="middle" fill="#e3b341">JavaScript</text>
      <animate attributeName="opacity" values="0;1" begin="4.15s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="323" y="212" width="72" height="28" rx="14" fill="#0f2a1f" stroke="#2da44e" stroke-width="1"/>
      <text x="359" y="231" text-anchor="middle" fill="#56d364">Python</text>
      <animate attributeName="opacity" values="0;1" begin="4.3s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="405" y="212" width="68" height="28" rx="14" fill="#0c2436" stroke="#1f6feb" stroke-width="1"/>
      <text x="439" y="231" text-anchor="middle" fill="#79c0ff">MySQL</text>
      <animate attributeName="opacity" values="0;1" begin="4.45s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="483" y="212" width="60" height="28" rx="14" fill="#2b150c" stroke="#f0883e" stroke-width="1"/>
      <text x="513" y="231" text-anchor="middle" fill="#f0883e">HTML</text>
      <animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="553" y="212" width="52" height="28" rx="14" fill="#122a33" stroke="#39c5cf" stroke-width="1"/>
      <text x="579" y="231" text-anchor="middle" fill="#56d4dd">CSS</text>
      <animate attributeName="opacity" values="0;1" begin="4.75s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="615" y="212" width="70" height="28" rx="14" fill="#12261e" stroke="#2da44e" stroke-width="1"/>
      <text x="650" y="231" text-anchor="middle" fill="#56d364">Node.js</text>
      <animate attributeName="opacity" values="0;1" begin="4.9s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="695" y="212" width="44" height="28" rx="14" fill="#26110f" stroke="#f85149" stroke-width="1"/>
      <text x="717" y="231" text-anchor="middle" fill="#ff7b72">Git</text>
      <animate attributeName="opacity" values="0;1" begin="5.05s" dur="0.4s" fill="freeze"/>
    </g>
  </g>

  <!-- Barra de progresso animada -->
  <rect x="170" y="268" width="560" height="4" rx="2" fill="#21262d"/>
  <rect x="170" y="268" width="0" height="4" rx="2" fill="url(#barGrad)">
    <animate attributeName="width" values="0;560" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.9;0.3" keyTimes="0;0.85;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e" letter-spacing="2">
    BUSCANDO ESTÁGIO / VAGA JÚNIOR — FULL STACK
  </text>
</svg>
