services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: petshop_php

    ports:
      - "8080:80"

    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src

    env_file:
      - .env
    environment:
      APP_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

    depends_on:
      - db

    restart: unless-stopped

  db:
    image: mysql:8.4

    container_name: petshop_db

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo

    volumes:
      - db_data:/var/lib/mysql
      # Script executado automaticamente na primeira criação do banco
      - ./docker/php/db/init.sql:/docker-entrypoint-initdb.d/init.sql


volumes:
  db_data:

